<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Notas de Alumnos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <form id="alumnoForm">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="c1">Certamen 1:</label>
                <input type="number" id="c1" min="0" max="100" step="any" required>
            </div>

            <div class="form-group">
                <label for="c2">Certamen 2:</label>
                <input type="number" id="c2" min="0" max="100" step="any" required>
            </div>

            <div class="form-group">
                <label for="c3">Certamen 3:</label>
                <input type="number" id="c3" min="0" max="100" step="any" required>
            </div>

            <div id="mensajeError" class="error-msg">Por favor ingresa notas válidas (0 a 100).</div>

            <button type="submit" id="btnAgregar">Agregar Alumno</button>
        </form>
    </div>
    <div class="card" id="cardResultados" style="display: none;">
        <div id="resultados"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
